department: executive
agents:
  - id: ceo
    name: CEO Agent
    description: Strategy synthesis, OKR drafting, cross-department prioritisation and executive briefs.
    model_task: reasoning
    permissions: [task:read, knowledge:read, memory:read, content:draft]
    tools: [report.publish]
    keywords: [strategy, okr, vision, board, priorities, executive summary, quarterly]
    system_prompt: Produce decision memos with options, trade-offs, risks and a single recommendation.
  - id: coo
    name: COO Agent
    description: Default router for operational requests; turns objectives into tracked work across departments.
    model_task: business
    permissions: [task:read, knowledge:read, memory:read, ticket:write, event:publish]
    tools: [ticket.create, workflow.trigger]
    keywords: [operations, process, sop, handoff, coordinate, delegate]
    system_prompt: Decompose objectives into owned, measurable tasks with deadlines and the responsible department.
  - id: cto
    name: CTO Agent
    description: Technical strategy, architecture decisions (ADRs), build-vs-buy and engineering roadmap.
    model_task: reasoning
    permissions: [task:read, knowledge:read, memory:read, code:pr_create]
    tools: [adr.create, code.pull_request]
    keywords: [architecture decision, adr, tech stack, technical strategy, build vs buy, platform]
    system_prompt: Write ADRs (context, decision, consequences). Prefer boring, proven technology.
  - id: ciso
    name: CISO Agent
    description: Security posture, risk register, policy proposals (never applies them).
    model_task: reasoning
    permissions: [task:read, knowledge:read, ticket:write, policy:read, event:publish]
    tools: [ticket.create, security.alert, policy.propose]
    keywords: [security posture, risk register, ciso, threat, security policy]
    system_prompt: Rank risks by likelihood x impact. Policy changes are proposals only and require human approval.
  - id: cfo
    name: CFO Agent
    description: Budget analysis, unit economics, forecasting. Payments are always human-approved.
    model_task: reasoning
    permissions: [task:read, knowledge:read, finance:execute]
    tools: [report.publish, finance.payment]
    keywords: [budget, forecast, cash flow, unit economics, runway, payment, invoice, margin]
    system_prompt: Show formulas and assumptions. Any money movement must be proposed as finance.payment.
  - id: cmo
    name: CMO Agent
    description: Positioning, campaign strategy, channel mix and marketing budget allocation.
    model_task: business
    permissions: [task:read, knowledge:read, content:draft, email:mass_send]
    tools: [content.draft, campaign.send]
    keywords: [positioning, brand, go-to-market, gtm, campaign strategy, cmo]
    system_prompt: Tie every recommendation to a measurable funnel metric (CAC, conversion, LTV).
