department: marketing
agents:
  - id: marketing-manager
    name: Marketing Manager Agent
    description: Campaign planning, calendar, attribution analysis.
    model_task: business
    permissions: [task:read, knowledge:read, content:draft]
    tools: [content.draft, report.publish]
    keywords: [marketing plan, content calendar, attribution, campaign]
  - id: seo-agent
    name: SEO Agent
    description: Keyword research, on-page audits, content briefs.
    model_task: business
    permissions: [task:read, knowledge:read, web:research, content:draft]
    tools: [web.search, content.draft]
    keywords: [seo, keyword, serp, backlink, meta description, ranking]
  - id: content-agent
    name: Content Agent
    description: Blog posts, landing pages, case studies; drafts only, publishing is reviewed.
    model_task: business
    permissions: [task:read, knowledge:read, content:draft]
    tools: [content.draft]
    keywords: [blog, article, landing page copy, case study, whitepaper, newsletter]
  - id: research-agent
    name: Research Agent
    description: Market and competitor research via SearXNG with source citations.
    model_task: reasoning
    permissions: [task:read, knowledge:read, web:research]
    tools: [web.search]
    keywords: [research, competitor, market size, tam, analysis, benchmark]
  - id: social-media
    name: Social Media Agent
    description: Social post drafts and scheduling proposals.
    model_task: fast
    permissions: [task:read, knowledge:read, content:draft, social:publish]
    tools: [content.draft, social.schedule, social.post]
    keywords: [tweet, linkedin post, social, instagram, thread]
  - id: ads-intelligence
    name: Ads Intelligence Agent
    description: Meta Ads Library, search visibility and competitor landing pages -> winning offers, ad angles, budgets.
    model_task: reasoning
    permissions: [task:read, knowledge:read, web:research]
    tools: [web.search, report.publish]
    keywords: [ads library, ad angles, winning offers, ad budget, competitor ads]
  - id: marketing-strategist
    name: Marketing Strategist Agent
    description: 30/60/90-day plans across SEO, email, social, reviews, GBP, retargeting and content.
    model_task: reasoning
    permissions: [task:read, knowledge:read, content:draft]
    tools: [content.draft, proposal.generate]
    keywords: [30 day plan, 90 day plan, marketing plan, growth plan]
  - id: video-studio
    name: Video Studio Agent
    description: Scripts, storyboards and short-form concepts (TikTok, Reels, Shorts, ad scripts); renders via FFmpeg/Remotion jobs.
    model_task: business
    permissions: [task:read, knowledge:read, content:draft]
    tools: [video.script, content.draft]
    keywords: [video script, tiktok, reels, shorts, storyboard, ad script]
