[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aicompany-os"
version = "0.1.0"
description = "Governed, self-hosted multi-agent AI company operating system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "AICOMPANY-OS Contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pyyaml>=6.0",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "prometheus-client>=0.20",
  "jinja2>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pgvector>=0.3"]
redis = ["redis>=5.0"]
knowledge = ["pypdf>=5", "python-docx>=1.1", "llama-index-core>=0.11"]
revenue-docs = ["python-docx>=1.1", "weasyprint>=62"]
langchain = ["langchain-core>=0.3", "langchain-ollama>=0.2"]
observability = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "langfuse>=2.50",
]
all = ["aicompany-os[postgres,redis,knowledge,langchain,observability]"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit>=2.7",
  "locust>=2.31",
]

[project.scripts]
aicos-plugin = "aicos.plugins.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/aicos", "services/api/src/aicos_api", "revenueos/src/revenueos"]

[tool.pytest.ini_options]
pythonpath = ["packages/core/src", "services/api/src", "revenueos/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires docker compose stack (postgres, redis, keycloak, vault, ollama)",
  "security: adversarial security tests",
]
addopts = "-m 'not integration' --strict-markers"

[tool.coverage.run]
source = ["aicos", "aicos_api", "revenueos"]
branch = true
omit = ["*/aicos/infrastructure/*"]  # covered by tests/integration against real services

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["packages/core/src", "services/api/src", "revenueos/src", "tests"]
extend-exclude = ["plugins/examples", "plugins/installed"]  # signed artifacts: never auto-format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S101", "RUF012", "S603", "S607", "PLC0415", "E501", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PLR", "BLE001", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/core/src", "services/api/src", "revenueos/src"]
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["plugins/examples/"]
