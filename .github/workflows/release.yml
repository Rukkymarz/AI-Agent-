name: release
# Builds, SBOMs, signs and pushes images on tags. DEPLOYMENT IS NOT AUTOMATED: production deploys require an
# approved AICOS proposal (two-person rule) and run via scripts/deploy.sh by a human.
on: { push: { tags: ["v*.*.*"] } }
permissions: { contents: write, packages: write, id-token: write }
jobs:
  image:
    runs-on: ubuntu-latest
    environment: release   # GitHub environment with required reviewers
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}", severity: CRITICAL, exit-code: "1", ignore-unfixed: true }
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign (Sigstore)
        run: cosign sign --yes ghcr.io/${{ github.repository }}/api@${{ steps.build.outputs.digest }}
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true }
