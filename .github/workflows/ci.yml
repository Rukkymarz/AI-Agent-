name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict) — fails on type errors
        run: mypy packages/core/src services/api/src

  unit-tests:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.12", "3.13"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Unit + agent + workflow + security + API tests (coverage gate 80%)
        run: pytest --cov --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "test-results-${{ matrix.python }}", path: "junit.xml\ncoverage.xml" }

  plugin-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Validate every bundled plugin manifest + integrity map
        run: for p in plugins/examples/*/; do aicos-plugin validate "$p"; done

  sast:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (OWASP + custom AICOS rules) — fails on ERROR
        uses: docker://semgrep/semgrep:1.97.0
        with:
          args: semgrep scan --config p/owasp-top-ten --config p/python --config p/secrets --config security/semgrep --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all]" pip-audit safety
      - name: pip-audit (PyPA advisory DB) — fails on any known vuln
        run: pip-audit --strict --progress-spinner off
      - name: Safety
        run: safety check --full-report || (echo "::error::Safety found vulnerabilities" && exit 1)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
      - name: OWASP Dependency-Check — fails on CVSS >= 9
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: aicompany-os
          path: .
          format: SARIF
          args: --failOnCVSS 9 --enableExperimental

  trivy-fs:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (vulns, secrets, IaC misconfig) — fails on CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  container:
    needs: [lint-type, unit-tests]
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "aicompany-os/api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Trivy image scan — fails on CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "aicompany-os/api:ci", severity: CRITICAL, exit-code: "1", ignore-unfixed: true, format: sarif, output: trivy-image.sarif }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-image.sarif, category: trivy-image }
      - name: Container runs as non-root
        run: test "$(docker inspect -f '{{.Config.User}}' aicompany-os/api:ci)" = "65532:65532"

  integration:
    needs: [container]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,postgres,redis]"
      - name: Apply schema
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE aicos_migrator LOGIN PASSWORD 'm'; CREATE ROLE aicos_app LOGIN PASSWORD 'a'; CREATE DATABASE aicos OWNER aicos_migrator;"
          psql -h localhost -U postgres -f infra/postgres/init/001_schema.sql
      - name: Integration tests (Postgres audit immutability, pgvector, Redis Streams)
        env:
          AICOS_IT_DATABASE_URL: postgresql://aicos_app:a@localhost:5432/aicos
          AICOS_IT_REDIS_URL: redis://localhost:6379/0
        run: pytest -m integration tests/integration -p no:cacheprovider --no-cov

  e2e:
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Boot API (dev mode) and run smoke + load test
        run: |
          AICOS_ENV=development AICOS_AUTH_MODE=dev AICOS_LLM_PROVIDER=echo AICOS_EMBEDDING_PROVIDER=hashing \
            uvicorn aicos_api.main:create_app --factory --port 8000 & sleep 5
          curl -fsS localhost:8000/healthz
          locust -f tests/load/locustfile.py --headless -u 20 -r 5 -t 30s --host http://localhost:8000 --exit-code-on-error 1
