apiVersion: v1
kind: ServiceAccount
metadata: { name: aicos-api }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aicos-api, labels: { app: aicos-api } }
spec:
  replicas: 3
  selector: { matchLabels: { app: aicos-api } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: aicos-api }
      annotations: { vault.hashicorp.com/agent-inject: "true", vault.hashicorp.com/role: "aicos-api" }
    spec:
      serviceAccountName: aicos-api
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: aicos-api } } }
      containers:
        - name: api
          image: aicompany-os/api
          ports: [{ containerPort: 8000, name: http }]
          env:
            - { name: AICOS_ENV, value: production }
            - { name: AICOS_SECRETS_DIR, value: /vault/secrets }
            - { name: AICOS_TLS_ENABLED, value: "true" }
            - { name: AICOS_ENCRYPTION_AT_REST, value: "true" }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { medium: Memory, sizeLimit: 256Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: aicos-api }
spec: { selector: { app: aicos-api }, ports: [{ port: 8000, targetPort: http }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: aicos-api }
spec: { minAvailable: 2, selector: { matchLabels: { app: aicos-api } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: aicos-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: aicos-api }
  minReplicas: 3
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
